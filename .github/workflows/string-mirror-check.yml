name: String Mirror Check

on:
  push:
    branches:
      - main
    paths:
      - 'app/src/main/res/values*/**'
      - '.github/workflows/string-mirror-check.yml'
      - 'scripts/**'
  pull_request:
    branches:
      - main
    paths:
      - 'app/src/main/res/values*/**'
      - '.github/workflows/string-mirror-check.yml'
      - 'scripts/**'

jobs:
  check-strings:
    name: Check TR-EN String Mirror
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify String Resources Mirror
        run: python3 scripts/check_string_mirror.py
