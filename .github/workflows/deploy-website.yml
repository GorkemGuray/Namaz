name: Deploy Website

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'

jobs:
  deploy-site:
    name: Deploy Website to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Namaz-App gh-pages
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          if [ -z "$RELEASE_REPO_TOKEN" ]; then
            echo "Error: RELEASE_REPO_TOKEN is not set."
            exit 1
          fi

          # Clone public repo gh-pages branch
          if git clone --branch gh-pages "https://x-access-token:${RELEASE_REPO_TOKEN}@github.com/GorkemGuray/Namaz-App.git" public-repo; then
            echo "Successfully cloned gh-pages branch"
          else
            echo "gh-pages branch not found, cloning default repository..."
            git clone "https://x-access-token:${RELEASE_REPO_TOKEN}@github.com/GorkemGuray/Namaz-App.git" public-repo
            cd public-repo
            git checkout -b gh-pages 2>/dev/null || git checkout --orphan gh-pages
            git rm -rf . || true
            cd ..
          fi

          # Backup existing version.json from the live site to preserve release version
          if [ -f public-repo/version.json ]; then
            cp public-repo/version.json version_backup.json
            echo "Backed up existing version.json"
          fi

          # Copy website files to the public repo
          cp -r website/* public-repo/

          # Restore version.json if it was backed up
          if [ -f version_backup.json ]; then
            cp version_backup.json public-repo/version.json
            echo "Restored original version.json"
          fi

          cd public-repo
          git config user.name "Namaz Website CI"
          git config user.email "website-ci@namaz.local"
          git add -A
          git diff --staged --quiet || git commit -m "Deploy website updates"
          git push origin gh-pages
