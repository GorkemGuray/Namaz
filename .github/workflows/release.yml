name: Namaz Release Pipeline

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    name: Build & Release Debug APKs
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle.kts', '**/gradle/libs.versions.toml', '**/gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Extract version from git tag
        id: version
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          echo "Tag: ${TAG_NAME}"
          VERSION_NAME="${TAG_NAME#v}"
          echo "Version name: ${VERSION_NAME}"
          echo "versionName=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          TAG_COUNT=$(git tag --list | wc -l | xargs)
          echo "Tag count: ${TAG_COUNT}"
          echo "versionCode=${TAG_COUNT}" >> "$GITHUB_OUTPUT"

      - name: Build debug APKs
        run: |
          ./gradlew :app:assembleDebug :wear:assembleDebug \
            -PciVersionName=${{ steps.version.outputs.versionName }} \
            -PciVersionCode=${{ steps.version.outputs.versionCode }} \
            --no-daemon

      - name: Rename APKs
        id: artifacts
        run: |
          VERSION="${{ steps.version.outputs.versionName }}"
          APP_APK="app/build/outputs/apk/debug/app-debug.apk"
          APP_APK_RENAMED="Namaz-${VERSION}-app-debug.apk"
          if [ -f "$APP_APK" ]; then
            cp "$APP_APK" "$APP_APK_RENAMED"
            echo "appApk=${APP_APK_RENAMED}" >> "$GITHUB_OUTPUT"
            echo "App APK ready: ${APP_APK_RENAMED}"
          else
            echo "ERROR: App APK not found at ${APP_APK}"
            exit 1
          fi

          WEAR_APK="wear/build/outputs/apk/debug/wear-debug.apk"
          WEAR_APK_RENAMED="Namaz-${VERSION}-wear-debug.apk"
          if [ -f "$WEAR_APK" ]; then
            cp "$WEAR_APK" "$WEAR_APK_RENAMED"
            echo "wearApk=${WEAR_APK_RENAMED}" >> "$GITHUB_OUTPUT"
            echo "Wear APK ready: ${WEAR_APK_RENAMED}"
          else
            echo "ERROR: Wear APK not found at ${WEAR_APK}"
            exit 1
          fi

      - name: Generate release notes
        id: release_notes
        run: |
          TAG_NAME="${GITHUB_REF_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "${TAG_NAME}" 2>/dev/null || echo "")
          if [ -z "$NOTES" ]; then
            NOTES="Namaz sürümü ${TAG_NAME#v} yayınlandı."
          fi
          DELIMITER="RELEASE_NOTES_EOF"
          echo "notes<<${DELIMITER}" >> "$GITHUB_OUTPUT"
          echo "$NOTES" >> "$GITHUB_OUTPUT"
          echo "${DELIMITER}" >> "$GITHUB_OUTPUT"

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          repository: GorkemGuray/Namaz-App
          token: ${{ secrets.RELEASE_REPO_TOKEN }}
          name: Namaz ${{ steps.version.outputs.versionName }}
          body: ${{ steps.release_notes.outputs.notes }}
          files: |
            ${{ steps.artifacts.outputs.appApk }}
            ${{ steps.artifacts.outputs.wearApk }}
          draft: false
          prerelease: false

      - name: Push version.json to public release repo
        if: env.RELEASE_REPO_TOKEN != ''
        env:
          RELEASE_REPO_TOKEN: ${{ secrets.RELEASE_REPO_TOKEN }}
        run: |
          VERSION="${{ steps.version.outputs.versionName }}"
          VERSION_CODE="${{ steps.version.outputs.versionCode }}"
          TAG_NAME="${GITHUB_REF_NAME}"
          NOTES=$(git tag -l --format='%(contents)' "${TAG_NAME}" 2>/dev/null | head -5 | tr '\n' ' ' | sed 's/"/\\"/g' || echo "Yeni özellikler ve hata düzeltmeleri.")

          cat > version.json << EOF
          {
            "version": "${VERSION}",
            "versionCode": ${VERSION_CODE},
            "releaseUrl": "https://github.com/GorkemGuray/Namaz-App/releases/tag/${TAG_NAME}",
            "releaseNotes": "${NOTES}"
          }
          EOF

          echo "Generated version.json:"
          cat version.json

          # Clone public repo gh-pages branch or set it up if it doesn't exist
          if git clone --branch gh-pages "https://x-access-token:${RELEASE_REPO_TOKEN}@github.com/GorkemGuray/Namaz-App.git" public-repo; then
            echo "Successfully cloned gh-pages branch"
          else
            echo "gh-pages branch not found, cloning default repository..."
            git clone "https://x-access-token:${RELEASE_REPO_TOKEN}@github.com/GorkemGuray/Namaz-App.git" public-repo
            cd public-repo
            git checkout -b gh-pages 2>/dev/null || git checkout --orphan gh-pages
            git rm -rf . || true
            cd ..
          fi

          cp version.json public-repo/version.json
          cd public-repo
          git config user.name "Namaz CI"
          git config user.email "ci@namaz.local"
          git add version.json
          git diff --staged --quiet || git commit -m "Update Namaz version to v${VERSION}"
          git push origin gh-pages
